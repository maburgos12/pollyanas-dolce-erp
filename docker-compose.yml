services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pastelerias_erp}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-pastelerias_erp}
      REDIS_URL: redis://redis:6379/0
    command: >
      /bin/sh -lc "exec /opt/venv/bin/gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers $${WEB_CONCURRENCY:-3}
      --timeout $${GUNICORN_TIMEOUT:-120}
      --preload
      --access-logfile -
      --error-logfile -"
    volumes:
      - .:/app
    ports:
      - "${WEB_HOST_PORT:-8011}:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
      erp_bridge:
        aliases:
          - pollyanas-erp
    stdin_open: true
    tty: true

  worker:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-pastelerias_erp}
      REDIS_URL: redis://redis:6379/0
    command: /opt/venv/bin/python -m celery -A config worker -l info --pool=solo --concurrency=1 -Q celery
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      default:
      erp_bridge:
        aliases:
          - pollyanas-erp-worker
    restart: unless-stopped

  worker_recetas:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-pastelerias_erp}
      REDIS_URL: redis://redis:6379/0
    command: /opt/venv/bin/python -m celery -A config worker -l info --pool=prefork --concurrency=1 --prefetch-multiplier=1 -Q recipes --hostname=recipes@%h
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/venv/bin/python -m celery -A config inspect ping -d recipes@$${HOSTNAME} --timeout=5"]
      interval: 60s
      timeout: 20s
      start_period: 60s
      retries: 3

  recetas_watchdog:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-pastelerias_erp}
      REDIS_URL: redis://redis:6379/0
      PGCONNECT_TIMEOUT: 5
    command: /opt/venv/bin/python manage.py watch_catalog_recipes
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import pathlib,time; assert time.time()-pathlib.Path('/tmp/recipes-watchdog-heartbeat').stat().st_mtime < 90"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  beat:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-pastelerias_erp}
      REDIS_URL: redis://redis:6379/0
    command: /bin/sh -lc "/opt/venv/bin/python manage.py setup_celery_schedules && /opt/venv/bin/python -m celery -A config beat -l info"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  erp_bridge:
    external: true
    name: pollyanas_erp_bridge
