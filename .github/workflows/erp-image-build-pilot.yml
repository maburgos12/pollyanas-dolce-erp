name: ERP image build pilot

on:
  pull_request:
    paths:
      - .github/workflows/erp-image-build-pilot.yml
      - Dockerfile
      - .dockerignore
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the production Dockerfile off the VPS
        run: docker build --platform linux/amd64 --tag erp-image-pilot .
      - name: Verify the image platform and runtime dependencies
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' erp-image-pilot)" = linux/amd64
          docker run --rm --network none --entrypoint python erp-image-pilot -c 'import celery, django, psycopg2, playwright'
          docker run --rm --network none --entrypoint ffmpeg erp-image-pilot -version
