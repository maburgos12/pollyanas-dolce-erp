name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "scripts/git_workspace_preflight.sh"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
      - "scripts/git_workspace_preflight.sh"

jobs:
  recipe-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipe_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recipe_recovery
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-recipe-recovery-isolated-key
      APP_ENV: development
      CATALOG_WORKER_PROOF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare isolated PostgreSQL
        run: python manage.py migrate --noinput
      - name: Prove recipe crash recovery and queue isolation
        run: python scripts/verify_catalog_worker_recovery.py
      - name: Preserve worker failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-worker-failure
          path: /tmp/recipe-proof-*.log

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_erp
      SECRET_KEY: ci-secret-key-temporal
      DEBUG: "True"
      APP_ENV: local
      ALLOWED_HOSTS: localhost,127.0.0.1
      TIME_ZONE: America/Mazatlan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django checks
        run: python manage.py check

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run focused cierre inventario tests
        run: |
          python manage.py test \
            pos_bridge.tests.test_product_month_closure_service \
            pos_bridge.tests.test_movement_sync_service.PointMovementSyncServiceTests \
            pos_bridge.tests.test_sales_sync_tasks.PointSalesSyncTaskRoutingTests.test_run_monthly_product_closure_targets_previous_month_by_default

      - name: Enforce critical page query budgets
        run: >-
          python manage.py test
          logistica.tests.LogisticaViewsTests
          --tag=performance
          --verbosity=2

      - name: Run full test suite (bloqueante)
        # Deuda legacy saneada al 100% en la auditoría 2026-07-25 (PRs #1136 y
        # ronda 2); desde entonces la suite completa bloquea el merge.
        # --keepdb: el contenedor de Postgres es efímero y el DROP final truena
        # cuando algún test deja conexiones abiertas (ObjectInUse) aunque la
        # suite esté en OK. ponytail: si el leak de conexiones causa flakes
        # entre tests, cazarlo en vez de ampliar este workaround.
        run: python manage.py test --keepdb
