name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only superseded versions of the SAME PR are cancelled. Each main run is unique.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recipe-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recipe_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recipe_recovery
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-recipe-recovery-isolated-key
      APP_ENV: development
      CATALOG_WORKER_PROOF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Prepare isolated PostgreSQL
        run: python manage.py migrate --noinput
      - name: Prove recipe crash recovery and queue isolation
        run: python scripts/verify_catalog_worker_recovery.py
      - name: Preserve worker failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recipe-worker-failure
          path: /tmp/recipe-proof-*.log

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_erp
      SECRET_KEY: ci-secret-key-temporal
      APP_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django checks
        run: python manage.py check
      - name: Verify backup and full-suite partition contracts
        run: |
          python -m unittest discover -s scripts/tests -p test_backup_db.py
          python -m unittest discover -s scripts/tests -p test_ci_test_shards.py
          cmp AGENTS.md CLAUDE.md
      - name: Verify migrations are committed and applicable
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py migrate --check

  suite:
    name: suite (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_erp
      SECRET_KEY: ci-secret-key-temporal
      DEBUG: "True"
      APP_ENV: local
      ALLOWED_HOSTS: localhost,127.0.0.1
      TIME_ZONE: America/Mazatlan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Full discovery includes cierre inventario and performance-tagged tests.
      # One database setup per job; keepdb avoids legacy open-connection DROP errors.
      - name: Run full-suite shard (bloqueante)
        run: >-
          python manage.py test --keepdb --noinput --timing
          --testrunner scripts.ci_test_runner.ShardedDiscoverRunner
          --shard-count 4 --shard-index ${{ matrix.shard }}
          --shard-manifest shard-${{ matrix.shard }}.json
      - name: Preserve discovered and assigned test inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-inventory-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  # Stable required check. always() prevents a skipped dependency from allowing merge.
  test:
    if: always()
    needs: [checks, recipe-recovery, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check and shard to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          RECOVERY_RESULT: ${{ needs.recipe-recovery.result }}
          SUITE_RESULT: ${{ needs.suite.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$RECOVERY_RESULT" = success
          test "$SUITE_RESULT" = success
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: test-inventory-*
          path: test-inventory
          merge-multiple: true
      - name: Prove complete coverage without omissions or duplicates
        run: python scripts/ci_test_shards.py test-inventory 4
